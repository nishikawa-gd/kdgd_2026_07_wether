<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>都道府県の天気</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>
  
</head>
<body class="pref">
  <div id="loading" class="loading-overlay"><div class="spinner"></div></div>
  <h2 class="js-pref-name">都道府県名</h2>

<div class="weather-container">
  <!-- ========================================
       【主役】今日の天気
       ======================================== -->
  <div class="today-weather">
    <h3>今日の天気</h3>
    <p class="js-date-today"></p>
    
    <!-- 天気メイン表記 -->
    <p class="weather-main js-weather-main-today"></p>
    
    <!-- アイコン画像 -->
    <div class="weather-img js-weather-img-today"></div>
    
    <!-- 気温 & 風情報 (アイコン付き) -->
    <div class="weather-details">
      <p class="weather-info info-temp js-temp-today"></p>
      <p class="weather-info info-wind js-wind-today"></p>
    </div>

    <!-- 降水確率テーブル -->
    <table class="rain-table">
      <thead>
        <tr>
          <th colspan="4" class="table-header-rain">降水確率</th>
        </tr>
        <tr>
          <th>00-06</th>
          <th>06-12</th>
          <th>12-18</th>
          <th>18-24</th>
        </tr>
      </thead>
      <tbody>
        <tr class="js-rain-today"></tr>
      </tbody>
    </table>
  </div>

  <!-- ========================================
       【控えめ】明日の天気
       ======================================== -->
  <div class="tomorrow-weather">
    <h3>明日の天気</h3>
    <p class="js-date-tomorrow"></p>
    
    <!-- 天気メイン表記 -->
    <p class="weather-main js-weather-main-tomorrow"></p>
    
    <!-- アイコン画像 -->
    <div class="weather-img js-weather-img-tomorrow"></div>
    
    <!-- 気温 & 風情報 (アイコン付き) -->
    <div class="weather-details">
      <p class="weather-info info-temp js-temp-tomorrow"></p>
      <p class="weather-info info-wind js-wind-tomorrow"></p>
    </div>

    <!-- 降水確率テーブル -->
    <table class="rain-table">
      <thead>
        <tr>
          <th colspan="4" class="table-header-rain">降水確率</th>
        </tr>
        <tr>
          <th>00-06</th>
          <th>06-12</th>
          <th>12-18</th>
          <th>18-24</th>
        </tr>
      </thead>
      <tbody>
        <tr class="js-rain-tomorrow"></tr>
      </tbody>
    </table>
  </div>
</div>

 <div class="back-link-container">
  <a href="index.html" class="btn-back">日本地図に戻る</a>
</div>

<audio id="js-secret-audio" src="img/sairen.mp3" preload="auto"></audio>
</body>
</html>
