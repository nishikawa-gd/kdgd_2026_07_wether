<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>都道府県の天気</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>

</head>

<body class="pref">
  <h2 class="js-pref-name">都道府県名</h2>

  <div class="pref_weather">
    <section class="today-weather">
      <div class="weather_title">
        <h3>今日の天気</h3>
        <p class="js-date-today"></p>
      </div>
      <div class="weather_submain">
        <div class="weather_main1">
          <p class="js-weather-main-today"></p>
          <div class="js-weather-img-today"></div>
        </div>
        <div class="weather_main2">
          <p class="js-temp-today"></p>
          <img src="img/thermometer.png" alt="温度計" class="thermometer">
        </div>

        <table>
          <thead>
            <tr>
              <th>時間帯</th>
              <th>降水確率</th>
              <th>風</th>
              <th>波</th>
            </tr>
          </thead>
          <tbody class="js-weather-table-today"></tbody>
        </table>
      </div>
    </section>

    <section class="tomorrow-weather">
      <div class="weather_title">
        <h3>明日の天気</h3>
        <p class="js-date-tomorrow"></p>
      </div>
      <div class="weather_submain">
        <div class="weather_main1">
          <p class="js-weather-main-tomorrow"></p>
          <div class="js-weather-img-tomorrow"></div>
        </div>
        <div class="weather_main2">
          <p class="js-temp-tomorrow"></p>
          <img src="img/thermometer.png" alt="温度計" class="thermometer">
        </div>

        <table>
          <thead>
            <tr>
              <th>時間帯</th>
              <th>降水確率</th>
              <th>風</th>
              <th>波</th>
            </tr>
          </thead>
          <tbody class="js-weather-table-tomorrow"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div>
    <a href="index.html" class="btn">
      <p>日本地図に戻る</p>
      <svg width="11" height="20" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1.5 18.5L8.84907 11.5025C9.71698 10.6761 9.71698 9.32386 8.84907 8.49748L1.5 1.5" stroke="#81A2D7"
          stroke-width="3" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </div>

</body>

</html>
