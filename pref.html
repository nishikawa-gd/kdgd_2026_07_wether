<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>都道府県の天気</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>

</head>

<body class="pref">
  <h2 class="js-pref-name">都道府県名</h2>

  <section class="today-weather">
    <h3>今日の天気</h3>
    <p class="js-date-today"></p>
    <p class="js-weather-main-today"></p>
    <p class="js-temp-today"></p>
    <div class="js-weather-img-today">
      <img src="img/sun.png" alt="晴れ">
      <img src="img/cloud.png" alt="曇り">
      <img src="img/rain.png" alt="雨">
      <img src="img/snow.png" alt="雪">
      <img src="img/thunder.png" alt="雷">
      <img src="img/fog.png" alt="霧">
    </div>
    <table>
      <thead>
        <tr>
          <th>時間帯</th>
          <th>降水確率</th>
          <th>風</th>
          <th>波</th>
        </tr>
      </thead>
      <tbody class="js-weather-table-today"></tbody>
    </table>
  </section>

  <section class="tomorrow-weather">
    <h3>明日の天気</h3>
    <p class="js-date-tomorrow"></p>
    <p class="js-weather-main-tomorrow"></p>
    <p class="js-temp-tomorrow"></p>
    <div class="js-weather-img-tomorrow"></div>
    <table>
      <thead>
        <tr>
          <th>時間帯</th>
          <th>降水確率</th>
          <th>風</th>
          <th>波</th>
        </tr>
      </thead>
      <tbody class="js-weather-table-tomorrow"></tbody>
    </table>
  </section>

  <p><a href="index.html">日本地図に戻る</a></p>

</body>

</html>
